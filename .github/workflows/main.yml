name: Build APK SOMED

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Accepter les licences Android SDK (SDK prÃ©installÃ© sur le runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Installer les dÃ©pendances
        run: bun install

      - name: Installer Capacitor
        run: bun add @capacitor/core @capacitor/cli @capacitor/android

      - name: Build web (Vite)
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: bun run build

      - name: Configurer Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.somed.app",
            "appName": "SOMED",
            "webDir": "dist"
          }
          EOF

      - name: Ajouter la plateforme Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Permissions (localisation, internet)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n</manifest>#' $MANIFEST

      - name: Build APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: somed-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
